<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikrouletten – fem årtier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #581c87 0%, #be185d 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px);
            opacity: 0.2;
        }
        
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #f472b6, #fde047, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 40px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255,0,255,0.6), 0 0 80px rgba(0,255,255,0.4);
            transition: transform 3s ease-out;
            overflow: hidden;
        }
        
        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 40px;
        }
        
        .wheel-segment span {
            font-size: 1.4rem;
            font-weight: bold;
            color: black;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
            transform: rotate(-36deg);
            display: inline-block;
        }
        
        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fde047, #ec4899);
            border: 4px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,0,0.8);
            transition: transform 0.2s;
            z-index: 10;
        }
        
        .center-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .center-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .play-icon {
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 8px;
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid white;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            z-index: 15;
        }
        
        .loading {
            font-size: 2.5rem;
            color: #22d3ee;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(255,0,255,0.5);
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .video-container {
            background: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,255,255,0.6), 0 0 80px rgba(255,0,255,0.4);
        }
        
        .video-title {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fde047, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .video-name {
            color: #22d3ee;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #1f2937;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Impact', Arial, sans-serif;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        
        .btn-youtube {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-youtube:hover {
            background: linear-gradient(90deg, #b91c1c, #dc2626);
        }
        
        .btn-spin {
            background: linear-gradient(90deg, #ec4899, #22d3ee);
            color: white;
        }
        
        .btn-spin:hover {
            background: linear-gradient(90deg, #db2777, #06b6d4);
        }
        
        .wheel-container { width: min(400px, 100%); height: auto; aspect-ratio: 1; }
        .wheel-label { position: absolute; left: 50%; top: 50%; color: #111;
            font: bold clamp(14px, 4vw, 22px) Arial, sans-serif; white-space: nowrap; }
        .center-button { margin-top: 0; padding: 0; width: 25%; height: 25%; }
        h1 { font-size: clamp(1.8rem, 8vw, 4rem); overflow-wrap: anywhere; }
        .video-container { padding: clamp(12px, 4vw, 30px); }
        .video-name { overflow-wrap: anywhere; }
        button { touch-action: manipulation; min-height: 48px; }
        button:focus-visible { outline: 4px solid white; outline-offset: 4px; }
        @media (max-width: 480px) {
            body { padding: 16px; }
            .video-title { font-size: 1.5rem; }
            .video-name { font-size: 1.1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; transition: none !important; }
        }
        .hidden {
            display: none;
        }
    </style>
</head>

        const wheel = document.getElementById('wheel');
        const segmentAngle = 360 / decades.length;
        const normalizeAngle = angle => ((angle % 360) + 360) % 360;
        // Conic gradients start at the top and run clockwise, like CSS rotation.
        function decadeIndexAtPointer(rotation) {
            return Math.floor(normalizeAngle(-rotation) / segmentAngle);
        }
        wheel.style.background = `conic-gradient(${decades.map((decade, index) =>
            `${decade.color} ${index * segmentAngle}deg ${(index + 1) * segmentAngle}deg`).join(',')})`;
        decades.forEach((decade, index) => {
            const label = document.createElement('span');
            label.className = 'wheel-label';
            label.textContent = decade.name;
            const angle = (index + 0.5) * segmentAngle;
            // Percentages keep the labels aligned when the wheel changes size.
            label.style.left = `${50 + 34 * Math.sin(angle * Math.PI / 180)}%`;
            label.style.top = `${50 - 34 * Math.cos(angle * Math.PI / 180)}%`;
            label.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
            wheel.appendChild(label);
        });

        let currentRotation = 0;
        let isSpinning = false;
        let selectedVideo = null;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            const loading = document.getElementById('loading');
            loading.textContent = 'Hjulet drejer…';
            loading.classList.remove('hidden');
            const chosenIndex = Math.floor(Math.random() * decades.length);
            // Stop safely inside a field, away from ambiguous boundaries.
            const pointInSegment = (0.2 + Math.random() * 0.6) * segmentAngle;
            const target = normalizeAngle(-(chosenIndex * segmentAngle + pointInSegment));
            const extraTurns = 5 + Math.floor(Math.random() * 3);
            const totalRotation = currentRotation + extraTurns * 360 +
                normalizeAngle(target - normalizeAngle(currentRotation));
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let finished = false;
            let fallback;
            function finishSpin() {
                if (finished) return;
                finished = true;
                clearTimeout(fallback);
                wheel.removeEventListener('transitionend', onTransitionEnd);
                currentRotation = normalizeAngle(totalRotation);
                wheel.style.transition = 'none';
                wheel.style.transform = `rotate(${currentRotation}deg)`;
                const selectedDecade = decades[decadeIndexAtPointer(currentRotation)].name;
                const videos = videoDatabase[selectedDecade];
                selectedVideo = videos[Math.floor(Math.random() * videos.length)];
                showVideo(selectedDecade);
            }
            function onTransitionEnd(event) {
                if (event.target === wheel && event.propertyName === 'transform') finishSpin();
            }
            wheel.addEventListener('transitionend', onTransitionEnd);
            wheel.style.transition = reducedMotion ? 'none' : 'transform 3s ease-out';
            // Flush the normalized starting rotation before the next transition.
            void wheel.offsetWidth;
            wheel.style.transform = `rotate(${totalRotation}deg)`;
            fallback = setTimeout(finishSpin, reducedMotion ? 0 : 3200);
        }

        function showVideo(decade) {
            document.getElementById('wheel-screen').classList.add('hidden');
            document.getElementById('video-screen').classList.remove('hidden');
            
            document.getElementById('videoTitle').textContent = `🎵 Musik fra ${decade}! 🎵`;
            document.getElementById('videoName').textContent = `${selectedVideo.title} (${selectedVideo.year})`;
            document.getElementById('videoFrame').src = 
                `https://www.youtube.com/embed/${selectedVideo.id}?autoplay=1&rel=0`;
        }

        function openYoutube() {
            if (!selectedVideo) return;
            window.open(`https://www.youtube.com/watch?v=${selectedVideo.id}`, '_blank', 'noopener,noreferrer');
        }

        function resetWheel() {
            document.getElementById('wheel-screen').classList.remove('hidden');
            document.getElementById('video-screen').classList.add('hidden');
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('videoFrame').removeAttribute('src');
            selectedVideo = null;
            document.getElementById('spinBtn').disabled = false;
            isSpinning = false;
            document.getElementById('spinBtn').focus();
        }
