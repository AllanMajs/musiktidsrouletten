<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiktidsrouletten – hits fra 1960 til 2009</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Impact', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #581c87 0%, #be185d 50%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.1) 35px, rgba(255,255,255,.1) 70px);
            opacity: 0.2;
        }
        
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            font-size: 4rem;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #f472b6, #fde047, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto 40px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255,0,255,0.6), 0 0 80px rgba(0,255,255,0.4);
            transition: transform 3s ease-out;
            overflow: hidden;
        }
        
        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fde047, #ec4899);
            border: 4px solid white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,255,0,0.8);
            transition: transform 0.2s;
            z-index: 10;
        }
        
        .center-button:hover:not(:disabled) {
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .center-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .play-icon {
            width: 0;
            height: 0;
            border-left: 30px solid white;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            margin-left: 8px;
        }
        
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid white;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            z-index: 15;
        }
        
        .loading {
            font-size: 2.5rem;
            color: #22d3ee;
            font-weight: bold;
            text-shadow: 2px 2px 0px rgba(255,0,255,0.5);
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .video-container {
            background: black;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,255,255,0.6), 0 0 80px rgba(255,0,255,0.4);
        }
        
        .video-title {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fde047, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .video-name {
            color: #22d3ee;
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #1f2937;
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Impact', Arial, sans-serif;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }
        
        .btn-youtube {
            background: linear-gradient(90deg, #dc2626, #ef4444);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-youtube:hover {
            background: linear-gradient(90deg, #b91c1c, #dc2626);
        }
        
        .btn-spin {
            background: linear-gradient(90deg, #ec4899, #22d3ee);
            color: white;
        }
        
        .btn-spin:hover {
            background: linear-gradient(90deg, #db2777, #06b6d4);
        }
        
        .hidden {
            display: none;
        }
        body { min-height: 100svh; padding: 24px 16px; }
        body::before { pointer-events: none; }
        .container { min-width: 0; }
        h1 { font-size: clamp(1.7rem, 7.5vw, 4rem); overflow-wrap: anywhere; }
        .wheel-container { width: min(100%, 400px); height: auto; aspect-ratio: 1; }
        .wheel-label { position: absolute; left: 50%; top: 50%; width: 28%; aspect-ratio: 1; display: grid; place-items: center;
            text-align: center; color: #111; font: bold clamp(.85rem, 4vw, 1.4rem) Arial, sans-serif;
            transform: translate(-50%, -50%) translate(var(--x), var(--y)); }
        .center-button { width: 25%; height: 25%; padding: 0; margin: 0; }
        .video-container { padding: clamp(12px, 4vw, 30px); }
        .video-title { font-size: clamp(1.25rem, 5vw, 2rem); }
        .video-name { font-size: clamp(1rem, 4vw, 1.5rem); overflow-wrap: anywhere; }
        .video-wrapper iframe { border: 0; }
        .playback-help { color: white; font: 1rem/1.5 Arial, sans-serif; margin-top: 16px; }
        .btn-youtube { text-decoration: none; padding: 15px; margin-top: 15px;
            border-radius: 10px; font-size: 1.2rem; min-height: 48px; }
        button, a { touch-action: manipulation; }
        button:focus-visible, a:focus-visible { outline: 4px solid #fde047; outline-offset: 4px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before { animation: none !important; }
            .wheel { transition: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="wheel-screen">
            <h1>MUSIKROULETTEN</h1>
            
            <div class="wheel-container">
                <div class="wheel" id="wheel" role="img" aria-label="Musikhjul med fem årtier"></div>

                <button class="center-button" id="spinBtn" aria-label="Drej musikhjulet" type="button">
                    <div class="play-icon" aria-hidden="true"></div>
                </button>
                
                <div class="pointer" aria-hidden="true"></div>
            </div>
            
            <div id="loading" class="loading hidden" role="status" aria-live="polite"></div>
        </div>
        
        <div id="video-screen" class="video-container hidden">
            <h2 class="video-title" id="videoTitle" tabindex="-1"></h2>
            <p class="video-name" id="videoName"></p>
            
            <div class="video-wrapper">
                <iframe id="videoFrame" title="Musikvideo" referrerpolicy="strict-origin-when-cross-origin" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>
            
            <p class="playback-help">Tryk på afspil i videoen. Hvis videoen ikke kan afspilles her, kan du åbne den på YouTube.</p>
            <a class="btn-youtube" id="youtubeLink" target="_blank" rel="noopener noreferrer">
                <span aria-hidden="true">↗</span> ÅBN PÅ YOUTUBE
            </a>
            <button class="btn-spin" id="resetBtn" type="button">
                SPIN IGEN!
            </button>
        </div>
    </div>

                }

        const FULL_TURN = 360;
        const SEGMENT_ANGLE = FULL_TURN / decades.length;
        const SPIN_DURATION = 3000;
        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spinBtn');
        const loading = document.getElementById('loading');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let currentRotation = 0;
        let isSpinning = false;
        let selectedVideo = null;
        let pendingSpin = null;

        function normalizeAngle(angle) {
            return ((angle % FULL_TURN) + FULL_TURN) % FULL_TURN;
        }

        // CSS conic gradients start at 12 o'clock and run clockwise.
        // The stationary pointer sees the wheel's inverse rotation.
        function getDecadeIndex(rotation) {
            return Math.floor(normalizeAngle(-rotation) / SEGMENT_ANGLE);
        }

        function renderWheel() {
            wheel.style.background = `conic-gradient(${decades.map((decade, index) =>
                `${decade.color} ${index * SEGMENT_ANGLE}deg ${(index + 1) * SEGMENT_ANGLE}deg`
            ).join(', ')})`;
            decades.forEach((decade, index) => {
                const angle = (index + 0.5) * SEGMENT_ANGLE * Math.PI / 180;
                const label = document.createElement('span');
                label.className = 'wheel-label';
                label.textContent = decade.name;
                // Percentages here are relative to the label, whose width is 28%.
                label.style.setProperty('--x', `${Math.sin(angle) * 125}%`);
                label.style.setProperty('--y', `${-Math.cos(angle) * 125}%`);
                wheel.appendChild(label);
            });
        }

        function validateCatalog() {
            const ids = new Set();
            decades.forEach((decade, index) => {
                const videos = videoDatabase[decade.name];
                if (!Array.isArray(videos) || videos.length === 0) {
                    throw new Error(`Ingen sange i ${decade.name}`);
                }
                videos.forEach(video => {
                    if (!/^[A-Za-z0-9_-]{11}$/.test(video.id) || !video.title ||
                        !Number.isInteger(video.year) ||
                        Math.floor(video.year / 10) * 10 !== 1960 + index * 10 || ids.has(video.id)) {
                        throw new Error(`Ugyldig sang eller forkert årti: ${video.title}`);
                    }
                    ids.add(video.id);
                });
            });
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            loading.textContent = 'Hjulet drejer…';
            loading.classList.remove('hidden');

            // Land away from boundaries, with equal probability for every decade.
            const targetIndex = Math.floor(Math.random() * decades.length);
            const landingAngle = (targetIndex + 0.2 + Math.random() * 0.6) * SEGMENT_ANGLE;
            const targetRotation = normalizeAngle(-landingAngle);
            const turns = 5 + Math.floor(Math.random() * 3);
            currentRotation += turns * FULL_TURN + normalizeAngle(targetRotation - currentRotation);

            let completed = false;
            let fallbackTimer;
            function finishSpin() {
                if (completed) return;
                completed = true;
                clearTimeout(fallbackTimer);
                wheel.removeEventListener('transitionend', onTransitionEnd);
                pendingSpin = null;
                const decade = decades[getDecadeIndex(currentRotation)].name;
                const videos = videoDatabase[decade];
                selectedVideo = videos[Math.floor(Math.random() * videos.length)];
                loading.textContent = `Valgt: ${decade}`;
                showVideo(decade);
            }
            function onTransitionEnd(event) {
                if (event.target === wheel && event.propertyName === 'transform') finishSpin();
            }
            pendingSpin = finishSpin;
            wheel.addEventListener('transitionend', onTransitionEnd);
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            // transitionend may be absent after backgrounding or changing motion settings.
            fallbackTimer = setTimeout(finishSpin, reducedMotion.matches ? 0 : SPIN_DURATION + 150);
        }

        function showVideo(decade) {
            document.getElementById('wheel-screen').classList.add('hidden');
            document.getElementById('video-screen').classList.remove('hidden');
            const heading = document.getElementById('videoTitle');
            heading.textContent = `🎵 Nu spiller vi fra ${decade}! 🎵`;
            document.getElementById('videoName').textContent = `${selectedVideo.title} (${selectedVideo.year})`;
            const frame = document.getElementById('videoFrame');
            frame.title = selectedVideo.title;
            // Delayed autoplay with sound is commonly blocked on mobile. Use player controls.
            frame.src = `https://www.youtube.com/embed/${selectedVideo.id}?playsinline=1&rel=0`;
            document.getElementById('youtubeLink').href = `https://www.youtube.com/watch?v=${selectedVideo.id}`;
            heading.focus({ preventScroll: true });
        }

        function resetWheel() {
            if (pendingSpin) return;
            document.getElementById('videoFrame').removeAttribute('src');
            document.getElementById('wheel-screen').classList.remove('hidden');
            document.getElementById('video-screen').classList.add('hidden');
            loading.classList.add('hidden');
            selectedVideo = null;
            document.getElementById('youtubeLink').removeAttribute('href');
            // Keep angles bounded and commit the current pose before the next transition.
            currentRotation = normalizeAngle(currentRotation);
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            void wheel.offsetWidth;
            wheel.style.transition = '';
            spinBtn.disabled = false;
            isSpinning = false;
            spinBtn.focus({ preventScroll: true });
        }

        renderWheel();
        try {
            validateCatalog();
            spinBtn.addEventListener('click', spinWheel);
            document.getElementById('resetBtn').addEventListener('click', resetWheel);
        } catch (error) {
            spinBtn.disabled = true;
            loading.textContent = 'Sanglisten kunne ikke indlæses. Prøv at genindlæse siden.';
            loading.classList.remove('hidden');
            console.error(error);
        }
